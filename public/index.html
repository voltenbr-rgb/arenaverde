<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arena Verde</title>
<meta name="theme-color" content="#26331a">
<meta name="description" content="Tower defense militar em pixel art: segure a base contra hordas de zumbis.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena Verde">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade militar, barulhento, divertido
   IDEA: um gabinete de fliperama com painel militar rebitado
   PICTURE: a própria arena em grade, com sprites pixel art desenhados em código
   COLOUR and TYPE: verde oliva, grama, ouro de medalha; Press Start 2P
   LAYOUT: HUD no topo, arena no centro, cartas embaixo (3-4 col no celular, 7 no PC) */
:root{--bg:#121809;--panel:#26331a;--edge:#5b7a2e;--hi:#a6d052;--ink:#e6eed2;--dim:#a3b583;--gold:#f2c230;--dark:#0b0f07;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Press Start 2P',ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:radial-gradient(circle at 20% 10%,#1d2810 0,transparent 50%),radial-gradient(circle at 80% 90%,#1d2810 0,transparent 50%),var(--bg)}
#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:6px;max-width:1500px;margin:0 auto}
.plate{background:var(--panel);border:3px solid var(--dark);box-shadow:inset 0 0 0 2px var(--edge),inset 0 0 0 4px #1b2511}
#hud{display:flex;align-items:center;gap:6px;padding:6px 8px}
.logo{color:var(--hi);font-size:12px;line-height:1.25;text-shadow:2px 2px 0 var(--dark);padding-right:10px;border-right:2px solid var(--edge)}
.stat{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:#0d1208;border:2px solid #000;box-shadow:inset 0 0 0 1px #3d5224;padding:5px 6px}
.stat>div{display:flex;flex-direction:column;gap:5px}
.ic{display:inline-flex}.ic svg{width:22px;height:22px;display:block}
.stat span{font-size:8px;color:var(--dim)}
.stat b{font-size:15px;font-weight:400;text-shadow:2px 2px 0 var(--dark)}
#hWave,#hScore{color:var(--gold)}#hLife,#hMoney{color:#8be04f}
#hLife.low{color:#ff6a4a;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.btns{display:flex;gap:4px}
button{font:inherit;color:var(--ink);cursor:pointer}
.sq{width:42px;height:42px;font-size:11px;background:#3a4d24;border:2px solid var(--dark);box-shadow:inset -2px -2px 0 #22301a,inset 2px 2px 0 #66863a}
.sq:active{box-shadow:inset 2px 2px 0 #22301a}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--dark);box-shadow:0 0 0 2px var(--edge),0 8px 0 2px #0a0d06;touch-action:none;cursor:crosshair}
#fx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;border:3px solid transparent}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(14px,3.4vw,30px);color:var(--gold);text-shadow:3px 3px 0 var(--dark),-2px -2px 0 var(--dark),2px -2px 0 var(--dark),-2px 2px 0 var(--dark);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;padding:0 8px;line-height:1.4}
#banner.show{opacity:1;transform:scale(1)}
#deck{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:6px}
.card{position:relative;background:linear-gradient(#3e5524,#2a3a18);border:3px solid var(--dark);box-shadow:inset 0 0 0 2px var(--edge);padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden;transition:transform .1s}
.card canvas{width:48px;height:48px;image-rendering:pixelated}
.card .nm{font-size:8px;text-align:center;line-height:1.35;min-height:2.7em;display:flex;align-items:center}
.card .cost{font-size:11px;color:var(--gold);text-shadow:1px 1px 0 var(--dark)}
.card .st{font-size:7px;color:var(--dim);white-space:nowrap}
.badge{position:absolute;top:4px;left:4px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#1b1605;font-size:8px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--dark),inset -2px -2px 0 #b98d12;z-index:1}
.coin{display:inline-block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,#f2c230 55%,#b98d12);box-shadow:0 0 0 1.5px #3a2a05;margin-right:5px;vertical-align:-1px}
.hpb{width:78%;height:4px;background:#0d1208;box-shadow:0 0 0 1px #000}.hpb i{display:block;height:100%;background:linear-gradient(#8be04f,#4f9a25)}
.panel.wide{width:min(1000px,100%)}
.ugrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.ucard{position:relative;background:linear-gradient(#3e5524,#2a3a18);border:3px solid var(--dark);box-shadow:inset 0 0 0 2px var(--edge);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:8px;line-height:1.45;min-height:44px}
.ucard canvas{width:76px;height:76px;image-rendering:pixelated;background:#22301a;border:2px solid var(--dark)}
.ucard .nm{font-size:9px;text-align:center;min-height:2.9em;display:flex;align-items:center}
.ucard .d{color:var(--dim);font-size:7px;text-align:center;min-height:3em}
.ucard .row{display:flex;justify-content:space-between;width:86%;font-size:8px}
.ucard.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 3px var(--gold);transform:translateY(-3px)}
.ucard:not(.on) .badge{background:#3a4d24;color:var(--dim);box-shadow:0 0 0 2px var(--dark)}
.ucard.enemy{background:linear-gradient(#3a3a26,#26261a)}.ucard.enemy canvas{background:#1d2215}
.bbar{position:sticky;bottom:-14px;z-index:2;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#0d1208;border:2px solid #000;box-shadow:inset 0 0 0 1px #3d5224;padding:8px 10px;font-size:9px}
.bbar .big{margin:0}.big:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.menu-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.hint{font-size:8px;color:var(--dim);line-height:1.8;margin-top:10px}
details.how{margin-top:12px}details.how summary{cursor:pointer;color:var(--gold);list-style:none}details.how summary::before{content:none}
@media (max-width:760px){.ugrid{grid-template-columns:repeat(2,minmax(0,1fr))}.ucard canvas{width:60px;height:60px}}
.card .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(0,0,0,.6);pointer-events:none}
.card.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 3px var(--gold);transform:translateY(-4px)}
.card.off canvas,.card.off .nm,.card.off .hpb{filter:grayscale(.85) brightness(.6)}
.card.off .cost{color:#c06048}
.card.nope,.ucard.nope{animation:nope .25s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card.tool{background:linear-gradient(#4a3a24,#33271a)}
#ov{position:fixed;inset:0;background:rgba(8,11,4,.88);display:grid;place-items:center;z-index:10;padding:14px;overflow:auto}
#ov.hide{display:none}
.panel{width:min(600px,100%);padding:22px 20px;text-align:center}
.title{margin:0 0 6px;font-size:clamp(30px,8vw,56px);line-height:1.05;font-weight:400;color:transparent;background:radial-gradient(circle at 20% 30%,#3f5a1e 0 14%,transparent 15%),radial-gradient(circle at 70% 60%,#2e4415 0 12%,transparent 13%),radial-gradient(circle at 45% 80%,#88b440 0 10%,transparent 11%),radial-gradient(circle at 85% 20%,#88b440 0 9%,transparent 10%),#6c9a32;background-size:90px 60px;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(3px 3px 0 #0b0f07) drop-shadow(-2px -2px 0 #0b0f07) drop-shadow(0 0 0 #c8e46a)}
.sub{font-size:10px;color:var(--gold);margin:0 0 14px;line-height:1.6}
#scene{width:100%;max-width:640px;aspect-ratio:240/100;image-rendering:pixelated;border:3px solid var(--dark);box-shadow:0 0 0 2px var(--edge);display:block;margin:0 auto 14px}
.how{font-size:9px;line-height:2;color:var(--dim);text-align:left;margin:0 auto 12px;max-width:470px;padding:0;list-style:none}
.how li::before{content:"★ ";color:var(--gold)}
.big{font-size:14px;background:var(--gold);color:#1b1605;border:3px solid var(--dark);box-shadow:inset -3px -3px 0 #b98d12,inset 3px 3px 0 #ffe27a;padding:15px 20px;margin:6px 4px 0;min-height:48px}
.alt{font-size:11px;background:#3a4d24;border:3px solid var(--dark);box-shadow:inset -3px -3px 0 #22301a,inset 3px 3px 0 #66863a;padding:13px 16px;margin:6px 4px 0;min-height:48px}
.rec{font-size:10px;color:var(--dim);margin-top:14px;line-height:1.8}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.res div{background:#1b2511;border:2px solid var(--dark);padding:10px 6px;font-size:8px;color:var(--dim);line-height:2}
.res b{display:block;font-size:16px;color:var(--gold);font-weight:400}
.board{list-style:none;padding:0;margin:10px 0 0;font-size:9px;text-align:left;line-height:2.1}
.board li{display:flex;gap:8px;border-bottom:1px dashed #3d5224}
.board li b{color:var(--gold);font-weight:400;width:2.2em}
.board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sendrow{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.sendrow input{font:inherit;font-size:16px;width:12ch;padding:8px;background:#121809;color:var(--ink);border:3px solid var(--dark);box-shadow:inset 0 0 0 2px var(--edge);text-transform:uppercase}
@media (orientation:portrait){
  #app{justify-content:center}
  #stage{flex:none;width:100%;aspect-ratio:262/126;max-height:60dvh}
  #deck{grid-template-columns:repeat(4,minmax(0,1fr))}
  .logo{display:none}.ic svg{width:14px;height:14px}.stat{gap:4px;padding:4px 3px}.badge{width:14px;height:14px;font-size:7px}
  .card canvas{width:56px;height:56px}
  .stat b{font-size:12px}
  #banner{top:30%}
}
@media (max-width:430px){.ic{display:none}.sq{width:36px;height:40px;font-size:9px}.stat span{font-size:7px}.stat b{font-size:11px}.card .nm{font-size:7px}}
@media (orientation:landscape) and (max-height:560px){
  #app{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:4px;padding:4px max(4px,env(safe-area-inset-right)) 4px max(4px,env(safe-area-inset-left))}
  #hud{grid-column:1/-1;padding:3px 5px;gap:4px}
  .logo,.stat span{display:none}.stat{padding:2px 6px;gap:6px}.stat b{font-size:12px}.ic svg{width:15px;height:15px}.sq{width:36px;height:30px;font-size:9px}
  #deck{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:3px;padding:4px;overflow-y:auto;scrollbar-width:none}
  .card{flex:1 1 0;flex-direction:row;justify-content:flex-start;padding:2px 8px 2px 18px;gap:6px;min-height:34px;max-height:64px}
  .card canvas{width:clamp(22px,7vh,34px);height:clamp(22px,7vh,34px)}
  .card .nm,.card .st,.card .hpb{display:none}.card .cost{font-size:10px;white-space:nowrap}
  .card .badge{width:13px;height:13px;font-size:6px;top:50%;left:3px;transform:translateY(-50%)}
  .card.sel{transform:translateX(4px)}
  .card .cd{top:0;bottom:auto}
  #stage{grid-column:2;grid-row:2}
  #banner{top:40%}
}
}
@media (prefers-reduced-motion:reduce){#banner,.card{transition:none}.card.nope,#hLife.low{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="plate">
    <div class="logo">ARENA<br>VERDE</div>
    <div class="stat"><i class="ic" data-ic="skull"></i><div><span>ONDA</span><b id="hWave">00</b></div></div>
    <div class="stat"><i class="ic" data-ic="heart"></i><div><span>VIDA</span><b id="hLife">100</b></div></div>
    <div class="stat"><i class="ic" data-ic="star"></i><div><span>PONTOS</span><b id="hScore">0</b></div></div>
    <div class="stat"><i class="ic" data-ic="coin"></i><div><span>DINHEIRO</span><b id="hMoney">$350</b></div></div>
    <div class="btns">
      <button class="sq" id="bPause" aria-label="Pausar">II</button>
      <button class="sq" id="bSpeed" aria-label="Velocidade">1x</button>
      <button class="sq" id="bSound" aria-label="Som">SOM</button>
    </div>
  </header>
  <main id="stage"><canvas id="cv" aria-label="Arena de batalha"></canvas><canvas id="fx" aria-hidden="true"></canvas><div id="banner"></div></main>
  <footer id="deck" class="plate"></footer>
</div>
<div id="ov"><div class="panel plate" id="panel"></div></div>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const COLS=9,ROWS=5,CELL=24,BASE=20,RIGHT=26,GX=BASE,GRID_END=GX+COLS*CELL,W=GRID_END+RIGHT,H=ROWS*CELL;
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const API='/api/scores';

/* ---------- pixel art (original, gerado em código) ---------- */
const PAL={K:'#141a0e',G:'#4f6b2a',g:'#36491c',L:'#7f9f40',S:'#f1c08e',s:'#c98f5c',E:'#111111',B:'#5a3a1e',b:'#3d2712',M:'#9aa0a6',m:'#5c6268',R:'#8a5a2a',Y:'#f2c230',W:'#f4f4ec',Z:'#8fc06a',z:'#5d8a42',X:'#b8322a',O:'#e8812c',P:'#4b4560',p:'#352f47',T:'#7a5a3a',t:'#5a3f26',C:'#cfd3d6',c:'#a0a5aa',V:'#9be22d'};
const SOLDIER=["................",".....KKKKKK.....","....KGGLLGGK....","...KGGLGGGGGK...","...KgGGGGGGGgK..","...KKKSSSSKKK...","....KSSSSESK....","....KSSSSSSK....","....KKsSSsKK....","...KgGGGGGGgK...","...KgGLGGGGgK...","...KgGGGGGGgK...","....KggKKggK....","....KgK..KgK....","....KBK..KBK....","...KBBK..KBBK..."];
const ZOMBIE=["................","....KKKKKK......","...KZZZZZZK.....","...KZZZzZZZK....","...KZWEZZWEK....","...KZZZZZZZK....","...KZKXXKZZK....","....KZZZZZK.....","...KTTTTTTKKKKK.","...KTtTTTTZZZZK.","...KTTtTTTKKKKK.","...KTTTTtTK.....","....KPPPPK......","....KPKKPK......","....KPK.KPK.....","...KZZK.KZZK...."];
const MINE=["....KKKK....","..KKmmmmKK..",".KmMMMMMMmK.","KmMCMMMMMMmK","KmmmmmmmmmmK",".KKKKKKKKKK."];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function paint(c,map,re={},ox=0,oy=0){const x=c.getContext('2d');map.forEach((row,j)=>{for(let i=0;i<row.length;i++){let ch=row[i];if(ch==='.')continue;ch=re[ch]||ch;x.fillStyle=PAL[ch]||ch;x.fillRect(ox+i,oy+j,1,1)}});return c}
function rects(c,l){const x=c.getContext('2d');for(const[a,b,w,h,col]of l){x.fillStyle=PAL[col]||col;x.fillRect(a,b,w,h)}return c}
function flip(c){const f=mk(c.width,c.height),x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f}
function x2(c){const f=mk(c.width*2,c.height*2),x=f.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(c,0,0,f.width,f.height);return f}
function white(c){const f=mk(c.width,c.height),x=f.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,f.width,f.height);return f}
const SOLDIER_BLINK=SOLDIER.map((r,j)=>j===6?r.replace('E','s'):r);
const soldier=(extra,blink)=>{const c=mk(18,16);paint(c,blink?SOLDIER_BLINK:SOLDIER);return rects(c,extra)};
const shiftR=(l,dx,dy=0)=>l.map(([a,b,w,h,c])=>[a+dx,b+dy,w,h,c]);
const A_RIFLE=[[7,9,11,1,'K'],[7,11,11,1,'K'],[6,10,12,1,'K'],[7,10,4,1,'R'],[11,10,6,1,'M'],[9,10,2,1,'S']];
const A_RELOAD=[[6,11,10,3,'K'],[7,12,4,1,'R'],[11,12,4,1,'M'],[9,8,3,4,'K'],[10,9,1,2,'S'],[9,13,3,3,'K'],[10,13,1,2,'m']];
const A_GREADY=[[4,9,1,3,'B'],[12,4,3,6,'K'],[13,4,1,5,'G'],[11,0,5,4,'K'],[12,1,3,2,'g'],[13,0,1,1,'M']];
const A_GWIND=[[4,9,1,3,'B'],[1,3,4,7,'K'],[2,4,2,5,'G'],[0,0,5,4,'K'],[1,1,3,2,'g'],[2,0,1,1,'M']];
const A_GTHROW=[[4,9,1,3,'B'],[11,7,7,3,'K'],[12,8,5,1,'G'],[16,8,1,1,'S']];
const A_GEMPTY=[[4,9,1,3,'B'],[11,9,3,4,'K'],[12,10,1,2,'G'],[12,12,1,1,'S']];
const A_MIS=[[1,8,17,3,'K'],[2,9,15,1,'M'],[15,8,2,3,'m'],[6,9,1,1,'Y'],[10,10,2,1,'S']];
const A_MEMPTY=[[1,9,15,3,'K'],[2,10,13,1,'m'],[10,11,2,1,'S'],[13,5,4,4,'K'],[14,6,2,2,'X']];
function tankSp(rec){return rects(mk(26,18),[[1,12,22,6,'K'],[2,13,20,4,'m'],[3,13,3,3,'M'],[7,13,3,3,'M'],[11,13,3,3,'M'],[15,13,3,3,'M'],[19,13,3,3,'M'],[2,8,21,5,'K'],[3,9,19,3,'G'],[3,9,19,1,'L'],[2,12,21,1,'g'],[6,3,11,6,'K'],[7,4,9,4,'G'],[7,4,9,1,'L'],[9,2,5,2,'K'],[16-rec,4,10,3,'K'],[16-rec,5,10,1,'M'],[11,5,1,1,'Y'],[10,6,3,1,'Y'],[11,7,1,1,'Y'],[4,10,2,1,'Y'],[18,10,2,1,'Y']])}
const A_MORT=[[8,14,9,2,'K'],[9,14,7,1,'m']];for(let i=0;i<5;i++)A_MORT.push([10+i,12-2*i,3,3,'K']);for(let i=0;i<5;i++)A_MORT.push([11+i,12-2*i,1,3,'m']);A_MORT.push([15,4,1,1,'M'],[14,9,1,6,'K']);
function mortSp(rec){const c=mk(20,16);paint(c,SOLDIER,{},-3,0);return rects(c,shiftR(A_MORT,0,rec))}
function mgSp(hot,rec){const c=mk(23,16);paint(c,SOLDIER.slice(0,10),{},-1,1);return rects(c,[[8-rec,6,14,3,'K'],[9-rec,7,8,1,'m'],[17-rec,7,5,1,hot?'#ff5a2a':'M'],[11,9,2,3,'K'],[12,5,3,1,'K'],[7,7,2,1,'S'],
 [0,10,23,6,'K'],[1,11,10,2,'#b59a62'],[12,11,10,2,'#b59a62'],[1,11,10,1,'#d8c189'],[12,11,10,1,'#d8c189'],[1,13,6,2,'#a38a55'],[8,13,7,2,'#b59a62'],[16,13,6,2,'#a38a55']])}
const FR={
 mg:{idle:mgSp(0,0),recoil:mgSp(0,1),hot:mgSp(1,0)},
 mortar:{idle:mortSp(0),recoil:mortSp(1)},
 rifle:{idle:soldier(A_RIFLE),blink:soldier(A_RIFLE,1),recoil:soldier(shiftR(A_RIFLE,-1)),reload:soldier(A_RELOAD)},
 grenade:{idle:soldier(A_GREADY),blink:soldier(A_GREADY,1),wind:soldier(A_GWIND),throw:soldier(A_GTHROW),empty:soldier(A_GEMPTY)},
 missile:{idle:soldier(A_MIS),blink:soldier(A_MIS,1),recoil:soldier(shiftR(A_MIS,-1)),reload:soldier(A_MEMPTY)},
 tank:{idle:tankSp(0),recoil:tankSp(3)}
};
const SP={

 if(u.type==='grenade'){if(u.wind>0)return F.wind;if(u.throwT>0)return F.throw;if(u.cd>.45)return F.empty}
