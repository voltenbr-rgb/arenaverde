<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Arena Verde</title>
    <meta name="theme-color" content="#26331a" />
    <meta name="description" content="Tower defense militar em pixel art: segure a base contra hordas de zumbis." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arena Verde" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=13" /><style>#avMultiLink{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:22;padding:11px 13px;border:2px solid #b7f34a;border-radius:999px;background:#11190eef;color:#d9ff9b;font:700 10px 'Press Start 2P',monospace;text-decoration:none;box-shadow:0 0 12px #b7f34a66}</style>
  </head>
  <body>
    <div id="app">
      <header id="hud" class="plate">
        <div class="logo">ARENA<br />VERDE</div>
        <div class="stat">
          <i class="ic" data-ic="skull"></i>
          <div><span>ONDA</span><b id="hWave">00/10</b></div>
        </div>
        <div class="stat">
          <i class="ic" data-ic="heart"></i>
          <div><span>VIDA</span><b id="hLife">100</b></div>
        </div>
        <div class="stat">
          <i class="ic" data-ic="star"></i>
          <div><span>PONTOS</span><b id="hScore">0</b></div>
        </div>
        <div class="stat">
          <i class="ic" data-ic="coin"></i>
          <div><span>MOEDAS</span><b id="hMoney">350</b></div>
        </div>
        <div class="btns">
          <button class="sq" id="bPause" aria-label="Pausar">II</button>
          <button class="sq" id="bSpeed" aria-label="Velocidade">1x</button>
          <button class="sq" id="bSound" aria-label="Som">SOM</button>
          <button class="sq" id="bRestart" aria-label="Reiniciar">
            <svg viewBox="0 0 8 8" shape-rendering="crispEdges" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M2 1h4v1h1v2H6V2H2v1H1V2h1zM1 4h1v2h4V5h1v1H6v1H2V6H1z" />
              <path fill="currentColor" d="M5 0h1v3H5zM2 5h1v3H2z" />
            </svg>
          </button>
        </div>
      </header>
      <main id="stage">
        <canvas id="cv" aria-label="Arena de batalha"></canvas><canvas id="fx" aria-hidden="true"></canvas>
        <div id="banner"></div>
        <div id="tctl" aria-hidden="true">
          <div id="joy" class="stick"><i></i></div>
          <div id="joy2" class="stick"><i></i></div>
          <div class="tbtns"><button id="tbMG">METRA&shy;LHADORA</button><button id="tbCannon">CANHÃO</button></div>
          <div class="tbtns2">
            <button id="tbSmoke">FUMAÇA</button><button id="tbSpec">MÍSSIL</button
            ><button id="tbSwap" aria-label="Trocar acessório">⇄</button>
          </div>
        </div>
        <button id="tpause" aria-label="Pausar">II</button>
        <div id="tkeys">
          W/S FRENTE-RÉ · A/D GIRAR · SETAS/MOUSE TORRETA · ESPAÇO CANHÃO · SHIFT METRALHADORA · E ACESSÓRIO · Q FUMAÇA
          · TAB TROCA
        </div>
        <div id="rotate">↻ GIRE O CELULAR PARA JOGAR MELHOR</div>
        <div id="bossbar" hidden>
          <span>CHEFÃO METRALHADORA</span>
          <div><i id="bossfill"></i></div>
        </div>
      </main>
      <footer id="deck" class="plate"></footer>
    </div>
    <div id="ov"><div class="panel plate" id="panel"></div></div>
    <div id="cardv" hidden role="dialog" aria-label="Carta"><img alt="" /><span>TOQUE PARA FECHAR</span></div>

    <a id="avMultiLink" href="/multiplayer/">⚔ MULTIPLAYER</a>\n    <script src="game.js?v=16" defer></script>
  </body>
</html>
